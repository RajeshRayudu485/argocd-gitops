apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-cronjob
  namespace: dev
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: demo
            image: busybox
            command: ["sh", "-c", "date"]
          restartPolicy: OnFailure
